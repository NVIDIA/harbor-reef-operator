# -- Number of controller replicas
replicaCount: 2

image:
  # -- Container image repository
  repository: nvcr.io/nvidia/harbor-reef-operator
  # -- Container image tag to deploy
  tag: "1.2.1"
  # -- Image pull policy for the controller container
  pullPolicy: IfNotPresent

# -- imagePullSecrets used to pull the operator image. Accepts either a list of
# secret names (e.g. `- my-secret`) or the Kubernetes-native form (e.g. `- name: my-secret`).
imagePullSecrets: []

# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

# -- ServiceAccount configuration
serviceAccount:
  # -- Create a ServiceAccount for the controller
  create: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- Name of the ServiceAccount to use. If not set, a name is generated
  name: ""

rbac:
  # -- Create RBAC resources (ClusterRole, ClusterRoleBinding)
  create: true

# -- Annotations to add to the controller pod
podAnnotations: {}

metrics:
  # -- Enable Prometheus metrics endpoint
  enabled: true
  # -- Port to expose metrics on
  port: 8080

# -- Leader election configuration
leaderElection:
  # -- Enable leader election to allow safe multi-replica deployments
  enabled: true
  # Timings follow k8s leaderelection best practices (LeaseDuration ≥ RenewDeadline ≥ RetryPeriod)
  # -- Lease duration before leadership can be taken by another replica
  leaseDuration: 30s
  # -- Deadline for the current leader to renew the lease
  renewDeadline: 15s
  # -- Retry period for clients to try leader election actions
  retryPeriod: 5s

# -- Comma-separated list of namespaces to watch; empty means cluster-scoped cache
watchNamespaces: ""

# -- Harbor connection settings for the ProxyCache controller.
# When harbor.url is set, the operator watches ProxyCache CRDs and ensures
# the corresponding registry endpoints and proxy projects exist in Harbor.
harbor:
  # -- Internal URL of the Harbor Core service (e.g., http://harbor-core.harbor.svc)
  url: ""
  # -- Name of the Kubernetes Secret containing the Harbor admin password
  adminSecret: "harbor-admin-password"
  # -- Key within the admin secret that holds the password
  adminSecretKey: "HARBOR_ADMIN_PASSWORD"
  # -- When true, deleting a ProxyCache CR from Kubernetes will NOT delete the
  # corresponding Harbor registry endpoint, project, or cached repositories.
  # The finalizer is still removed so the CR can be garbage collected. Default
  # (false) cascades cleanup so `kubectl delete proxycache` empties the project
  # of cached images and removes the registry endpoint.
  retainOnDelete: false

# -- securityContext applied to the controller container
containerSecurityContext:
  # -- Require the container to run as non-root
  runAsNonRoot: true
  # -- User ID the container process runs as
  runAsUser: 65532
  # -- Disallow privilege escalation (recommended)
  allowPrivilegeEscalation: false
  # -- Mount the root filesystem as read-only
  readOnlyRootFilesystem: true

# -- Resource requests and limits for the controller container
resources:
  requests:
    # -- Requested CPU for the controller container
    cpu: 100m
    # -- Requested memory for the controller container
    memory: 256Mi
  limits:
    # -- CPU limit for the controller container
    cpu: 500m
    # -- Memory limit for the controller container
    memory: 512Mi

# -- Node selector labels for scheduling the controller pod
nodeSelector: {}

# -- Tolerations applied to the controller pod
tolerations: []

# -- Affinity rules for the controller pod
affinity: {}
