apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cascade-delete
spec:
  description: |
    Verifies the ProxyCache finalizer cascades cleanup of cached repositories,
    the Harbor proxy project, and the registry endpoint when a CR is deleted.

    This is the highest-value e2e test: the finalizer's "empty project before
    deleting it" path requires a project that actually contains a cached
    repository, which only happens after Harbor has actually proxied artifacts
    from the upstream. The test fetches the manifest and one blob through
    Harbor's v2 API to force the proxy-cache project to register a repo --
    we cannot rely on a kubelet pull because containerd deduplicates images
    by digest across registry paths and may short-circuit the pull.

    Also implicitly validates:
      - operator has the ClusterRole 'update' verb on proxycaches (finalizer add/remove)
      - Harbor's "project not empty" error is handled by DeleteAllRepositoriesInProject
      - The delete order: repos -> project -> registry endpoint

    Concurrency: $namespace is unique per run, so ProxyCache and Harbor
    project names will not collide between parallel CI pipelines.

    The runner must inject HARBOR_API_BASE (full URL with scheme, e.g.
    "https://harbor.example.com") and HARBOR_ADMIN_PASS via env. See
    test/chainsaw/README.md for the contract.
  bindings:
  - name: pcName
    value: (join('-', ['chainsaw-cascade', $namespace]))
  steps:
  - name: create-proxycache
    description: Create a public ProxyCache and wait for it to be Ready
    try:
    - apply:
        file: proxycache.yaml
    - assert:
        file: proxycache-ready.yaml
    cleanup:
    # If the test fails partway, drop the CR so the next run starts clean.
    # The finalizer cascade still runs here -- this cleanup itself exercises
    # part of the path under test, which is fine.
    - delete:
        ref:
          apiVersion: harbor-reef.nvidia.com/v1alpha1
          kind: ProxyCache
          name: ($pcName)

  - name: populate-cache-via-v2-api
    description: |
      Hit Harbor's v2 registry API as the docker client would. Harbor's
      proxy-cache logic fetches the manifest + config blob from upstream
      registry.k8s.io and records a repository under the project.
    try:
    - script:
        env:
        - name: PC_NAME
          value: ($pcName)
        content: |
          set -euo pipefail
          : "${HARBOR_API_BASE:?HARBOR_API_BASE must be set by the runner}"
          : "${HARBOR_ADMIN_PASS:?HARBOR_ADMIN_PASS must be set by the runner}"
          BASE="$HARBOR_API_BASE/v2/$PC_NAME/pause"
          # Multi-arch manifest list
          curl -sk -u "admin:$HARBOR_ADMIN_PASS" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
            --fail -o /tmp/list.json "$BASE/manifests/3.10"
          ARCH_DIGEST=$(jq -r '.manifests[]? | select(.platform.os=="linux" and .platform.architecture=="amd64") | .digest' /tmp/list.json | head -1)
          if [ -z "$ARCH_DIGEST" ]; then
            # Fallback for single-arch manifests
            CFG_DIGEST=$(jq -r '.config.digest // empty' /tmp/list.json)
            if [ -n "$CFG_DIGEST" ]; then
              curl -sk -u "admin:$HARBOR_ADMIN_PASS" --fail -o /dev/null "$BASE/blobs/$CFG_DIGEST"
              exit 0
            fi
            echo "FAIL: no amd64 manifest in list and no direct config"
            cat /tmp/list.json
            exit 1
          fi
          # Arch-specific manifest
          curl -sk -u "admin:$HARBOR_ADMIN_PASS" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' \
            --fail -o /tmp/m.json "$BASE/manifests/$ARCH_DIGEST"
          # Pull config + every layer so Harbor caches the full repository.
          jq -r '.config.digest, (.layers // [])[].digest' /tmp/m.json | while read -r d; do
            [ -z "$d" ] && continue
            curl -sk -u "admin:$HARBOR_ADMIN_PASS" --fail -o /dev/null "$BASE/blobs/$d"
          done

  - name: confirm-repo-cached
    description: Sanity check -- Harbor must list at least 1 repo in the project
    try:
    - script:
        env:
        - name: PC_NAME
          value: ($pcName)
        content: |
          set -euo pipefail
          : "${HARBOR_API_BASE:?HARBOR_API_BASE must be set by the runner}"
          : "${HARBOR_ADMIN_PASS:?HARBOR_ADMIN_PASS must be set by the runner}"
          # Harbor registers the repo a moment after blobs are served.
          for i in $(seq 1 10); do
            n=$(curl -sk -u "admin:$HARBOR_ADMIN_PASS" --fail \
              "$HARBOR_API_BASE/api/v2.0/projects/$PC_NAME/repositories" | jq 'length')
            echo "attempt $i: repositories in project $PC_NAME: $n"
            if [ "$n" -ge 1 ]; then exit 0; fi
            sleep 2
          done
          echo "FAIL: project still has 0 repositories after 20s"
          exit 1

  - name: delete-and-assert-cascade
    description: |
      Delete the ProxyCache and confirm Harbor side is fully cleaned up.
      Tight 30s delete timeout: a hung finalizer or a missing 'update' verb on
      the operator's ClusterRole would block kubectl delete and trip this.
    try:
    - delete:
        ref:
          apiVersion: harbor-reef.nvidia.com/v1alpha1
          kind: ProxyCache
          name: ($pcName)
    - script:
        env:
        - name: PC_NAME
          value: ($pcName)
        content: |
          set -euo pipefail
          : "${HARBOR_API_BASE:?HARBOR_API_BASE must be set by the runner}"
          : "${HARBOR_ADMIN_PASS:?HARBOR_ADMIN_PASS must be set by the runner}"
          regs=$(curl -sk -u "admin:$HARBOR_ADMIN_PASS" --fail \
            "$HARBOR_API_BASE/api/v2.0/registries?name=$PC_NAME" | jq 'length')
          projs=$(curl -sk -u "admin:$HARBOR_ADMIN_PASS" --fail \
            "$HARBOR_API_BASE/api/v2.0/projects?name=$PC_NAME" | jq 'length')
          echo "registries=$regs projects=$projs"
          if [ "$regs" != "0" ] || [ "$projs" != "0" ]; then
            echo "FAIL: Harbor state not cleaned up"
            exit 1
          fi
    timeouts:
      delete: 30s
