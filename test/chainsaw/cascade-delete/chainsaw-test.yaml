apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cascade-delete
spec:
  description: |
    Verifies the ProxyCache finalizer deletes the Harbor proxy project and
    the registry endpoint when a CR is deleted.

    Asserts the operator's side of the cleanup contract:
      - the finalizer runs (kubectl delete returns within 30s)
      - the operator removes the registry endpoint in Harbor
      - the operator removes the proxy project in Harbor
      - operator has the ClusterRole 'update' verb on proxycaches
        (finalizer add/remove would otherwise 403 -- this is implicit
        in the kubectl delete completing at all)

    Out of scope (covered by Go unit tests in pkg/harbor/client_test.go
    against an httptest stub):
      - DeleteAllRepositoriesInProject's pagination + "empty before
        delete project" ordering (TestDeleteAllRepositoriesInProject)
      - The behaviour of Harbor's proxy-cache fetching upstream
        artifacts -- that's Harbor's job, not the operator's, and
        coupling the e2e to it makes the test flaky on Harbor timing.

    Concurrency: $namespace is unique per run, so ProxyCache and Harbor
    project names will not collide between parallel CI pipelines.

    The runner must inject HARBOR_API_BASE (full URL with scheme, e.g.
    "https://harbor.example.com") and HARBOR_ADMIN_PASS via env. See
    test/chainsaw/README.md for the contract.
  bindings:
  - name: pcName
    value: (join('-', ['chainsaw-cascade', $namespace]))
  steps:
  - name: create-proxycache
    description: Create a public ProxyCache and wait for it to be Ready
    try:
    - apply:
        file: proxycache.yaml
    - assert:
        file: proxycache-ready.yaml
    cleanup:
    # If the test fails partway, drop the CR so the next run starts clean.
    # The finalizer cascade still runs here -- this cleanup itself exercises
    # part of the path under test, which is fine.
    - delete:
        ref:
          apiVersion: harbor-reef.nvidia.com/v1alpha1
          kind: ProxyCache
          name: ($pcName)

  - name: delete-and-assert-cascade
    description: |
      Delete the ProxyCache and confirm Harbor side is cleaned up.
      Tight 30s delete timeout: a hung finalizer or a missing 'update' verb on
      the operator's ClusterRole would block kubectl delete and trip this.
    try:
    - delete:
        ref:
          apiVersion: harbor-reef.nvidia.com/v1alpha1
          kind: ProxyCache
          name: ($pcName)
    - script:
        env:
        - name: PC_NAME
          value: ($pcName)
        content: |
          set -eu
          : "${HARBOR_API_BASE:?HARBOR_API_BASE must be set by the runner}"
          : "${HARBOR_ADMIN_PASS:?HARBOR_ADMIN_PASS must be set by the runner}"
          # The operator's finalizer calls Harbor DELETE synchronously, so
          # state SHOULD already be clean once kubectl delete returns. But
          # Harbor's search-indexed list endpoints can lag a second or two
          # behind the underlying DB write. Retry briefly to absorb that.
          for i in $(seq 1 5); do
            regs=$(curl -sk -u "admin:$HARBOR_ADMIN_PASS" --fail \
              "$HARBOR_API_BASE/api/v2.0/registries?name=$PC_NAME" | jq 'length')
            projs=$(curl -sk -u "admin:$HARBOR_ADMIN_PASS" --fail \
              "$HARBOR_API_BASE/api/v2.0/projects?name=$PC_NAME" | jq 'length')
            echo "attempt $i: registries=$regs projects=$projs"
            if [ "$regs" = "0" ] && [ "$projs" = "0" ]; then exit 0; fi
            sleep 2
          done
          echo "FAIL: Harbor state not cleaned up after 10s"
          exit 1
    timeouts:
      delete: 30s
